name: Release VSIX

on:
  push:
    tags:
      - 'v*'   # trigger khi push tag v1.0.0
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: npm run lint && npm test

      - name: Build VSIX
        run: npm run package

      - name: Audit packaged runtime
        run: npm audit --omit=dev --audit-level=high && npm --prefix runtime/codegraph/lib audit --omit=dev --audit-level=high --package-lock=false

      - name: Upload VSIX to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            *.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
