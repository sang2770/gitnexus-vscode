name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  verify-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: npm --prefix runtime/codegraph/lib audit --omit=dev --audit-level=high --package-lock=false
